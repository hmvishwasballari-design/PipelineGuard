[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineguard"
version = "1.0.0"
description = "CI/CD Pipeline Security Gate and Workflow Analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PipelineGuard Security Team" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML==6.0.3",
]

[project.scripts]
pipelineguard = "security.workflow.__main__:main"
pipelineguard-workflow = "security.workflow.__main__:main"

[tool.setuptools.package-data]
"security" = ["py.typed"]
"security.workflow" = ["py.typed", "schemas/*.json"]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "hypothesis==6.169.0",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.9",
    "types-PyYAML==6.0.12.20260906",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.bandit]
targets = ["security"]
exclude_dirs = ["security/workflow/tests"]

[tool.coverage.run]
omit = [
    "security/workflow/tests/*",
    "security/workflow/labs/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pyrefly]
search-path = ["."]
python-interpreter-find-command = ["python", "-c", "import sys; print(sys.executable)"]
ignore-missing-imports = ["yaml", "yaml.*"]

[tool.pyrefly.errors]
missing-source = "ignore"
missing-source-for-stubs = "ignore"


